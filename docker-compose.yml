# xtracto — stack de production.
# L'app écoute sur 127.0.0.1:4100, un reverse proxy Nginx sur l'hôte la publie en HTTPS
# (voir deploy/README.md).
name: xtracto

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xtracto:latest
    container_name: xtracto-app
    restart: always
    ports:
      # Bindé sur 127.0.0.1, jamais 0.0.0.0 : Docker insère ses règles iptables en
      # amont du pare-feu de l'hôte, un port publié sur 0.0.0.0 n'est filtré par
      # aucune règle. Le reverse proxy de l'hôte vise 127.0.0.1:4100.
      - "127.0.0.1:4100:3000" # hôte 4100 -> conteneur 3000 (Next)
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      OUTPUT_ROOT: /data/output
    volumes:
      - ./data/output:/data/output

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: xtracto-worker:latest
    container_name: xtracto-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      OUTPUT_ROOT: /data/output
    volumes:
      - ./data/output:/data/output

  postgres:
    image: postgres:16
    container_name: xtracto-postgres
    restart: always
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB viennent de .env.production.
    env_file: .env.production
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
