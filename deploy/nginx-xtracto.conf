# xtracto.tranevat.fr — reverse proxy vers le conteneur Next.js (hôte:4100).
# Point de départ HTTP ; `certbot --nginx -d xtracto.tranevat.fr` réécrit ce
# fichier pour ajouter le bloc 443/SSL automatiquement.

server {
    listen 80;
    listen [::]:80;
    server_name xtracto.tranevat.fr;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le téléchargement d'une vidéo complète peut prendre du temps.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
